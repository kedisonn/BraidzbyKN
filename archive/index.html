<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BraidzbyKN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- All styles are inline below. You can move them into styleSheet.css and re-add the link if you prefer. -->
    <style>
        :root {
            --main: #fff8eb;
            --secondary: #4c271d;
            --secondary-soft: rgba(76, 39, 29, 0.68);
            --line: rgba(76, 39, 29, 0.2);
            --serif: "Playfair Display", "Bodoni MT", Didot, Georgia, "Times New Roman", serif;
            --sans: var(--serif);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--secondary);
            font-family: var(--sans);
            font-weight: 400;
            font-size: 1.05rem;
            line-height: 1.7;
            font-variant-numeric: lining-nums;
            /* light gradient, #fff8eb as the main colour */
            background: #fff8eb linear-gradient(135deg, #fff8eb 0%, #fff8eb 30%, #fdeccc 70%, #f9e0bb 100%) fixed;
        }

        a { color: inherit; }
        button { font: inherit; color: inherit; }

        :focus-visible {
            outline: 2px solid var(--secondary);
            outline-offset: 3px;
            border-radius: 2px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        /* ---------- Header ---------- */
        .site-header {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.4rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
        }

        /* Reserved space for the logo */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .menu-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.6rem 0;
            border: 0;
            background: none;
            cursor: pointer;
            font-weight: 400;
        }

        .burger,
        .burger::before,
        .burger::after {
            display: block;
            width: 22px;
            height: 1.5px;
            background: var(--secondary);
        }

        .burger { position: relative; }
        .burger::before, .burger::after { content: ""; position: absolute; left: 0; }
        .burger::before { top: -7px; }
        .burger::after { top: 7px; }

        .menu-toggle[aria-expanded="true"] .burger { background: transparent; }
        .menu-toggle[aria-expanded="true"] .burger::before { top: 0; transform: rotate(45deg); }
        .menu-toggle[aria-expanded="true"] .burger::after { top: 0; transform: rotate(-45deg); }

        .menu-bar {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 2rem;
            z-index: 20;
            width: min(260px, calc(100vw - 2rem));
            padding: 0.8rem 1.4rem;
            background: var(--main);
            border: 1px solid var(--secondary);
        }

        .menu-bar[hidden] { display: none; }

        .menu-bar ul { list-style: none; margin: 0; padding: 0; }

        .menu-bar li + li { border-top: 1px solid var(--line); }

        .menu-bar a,
        .submenu-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0.7rem 0;
            border: 0;
            background: none;
            text-align: left;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
        }

        .menu-bar a:hover,
        .submenu-toggle:hover { text-decoration: underline; text-underline-offset: 4px; }

        .menu-bar .active > a { font-weight: 500; }

        .submenu-toggle::after {
            content: "";
            width: 7px;
            height: 7px;
            border-right: 1.5px solid var(--secondary);
            border-bottom: 1.5px solid var(--secondary);
            transform: rotate(45deg);
            margin-right: 3px;
        }

        .submenu-toggle[aria-expanded="true"]::after { transform: rotate(-135deg); }

        .submenu { padding: 0 0 0.5rem 1rem; }
        .submenu[hidden] { display: none; }
        .submenu li + li { border-top: 0; }
        .submenu a { padding: 0.4rem 0; font-weight: 300; }

        /* ---------- Sections ---------- */
        .section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3.5rem 2rem;
        }

        .welcome {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 3rem;
            align-items: start;
            border-bottom: 1px solid var(--line);
        }

        h1, h2, h3 {
            margin: 0 0 0.6rem;
            font-family: var(--serif);
            font-weight: 500;
            line-height: 1.1;
        }

        h1 { font-size: clamp(2.4rem, 5vw, 3.6rem); }
        h2 { font-size: clamp(1.8rem, 3.4vw, 2.4rem); }
        h3 { font-size: 1.5rem; }

        .welcome p { margin: 0; max-width: 26rem; color: var(--secondary-soft); }

        .form { display: grid; gap: 1.6rem; max-width: 26rem; }

        .field label,
        .field legend {
            display: block;
            margin-bottom: 0.2rem;
            padding: 0;
            font-size: 0.92rem;
            font-weight: 400;
        }

        .field input[type="text"],
        .field input[type="password"],
        .field input[type="email"],
        .field input[type="tel"] {
            width: 100%;
            padding: 0.55rem 0;
            border: 0;
            border-bottom: 1px solid var(--secondary);
            border-radius: 0;
            background: transparent;
            color: var(--secondary);
            font: inherit;
            font-size: 1.05rem;
        }

        .field input:focus { outline: none; box-shadow: 0 1px 0 0 var(--secondary); }

        .btn {
            display: inline-block;
            padding: 0.9rem 2rem;
            border: 1px solid var(--secondary);
            border-radius: 999px;
            font-size: 0.98rem;
            font-weight: 400;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-solid { background: var(--secondary); color: var(--main); }
        .btn-solid:hover { background: transparent; color: var(--secondary); }
        .btn-ghost { background: transparent; color: var(--secondary); }
        .btn-ghost:hover { background: var(--secondary); color: var(--main); }
        .form .btn { justify-self: start; }

        .actions { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1.4rem; }

        [hidden] { display: none !important; }

        /* ---------- Responsive ---------- */
        @media (max-width: 820px) {
            .welcome { grid-template-columns: 1fr; gap: 2rem; }
            .site-header { padding: 1rem 1.25rem; }
            .menu-bar { right: 1.25rem; }
            .section { padding: 2.5rem 1.25rem; }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <a class="logo" href="index.html" aria-label="Home">
            <!-- Space reserved for the logo. The image hides itself if the file isn't found. -->
            <img src="images/logo/bbkn-logo.png" alt="" onerror="this.style.display='none'">
        </a>

        <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="menu">
            <span class="burger" aria-hidden="true"></span>
            <span>Menu</span>
        </button>

        <nav class="menu-bar" id="menu" aria-label="Main" hidden>
            <ul>
                <li class="active"><a href="index.html" aria-current="page">Home</a></li>
                <li><a href="braids.html">Braids</a></li>
                <li><a href="bookings.html">Bookings</a></li>
                <li>
                    <button type="button" class="submenu-toggle" id="loginToggle" aria-expanded="false" aria-controls="loginSub">Login</button>
                    <ul class="submenu" id="loginSub" hidden>
                        <li><a href="signup.html">New here? Sign up</a></li>
                    </ul>
                </li>
                <li><a href="logout.html">Logout</a></li>
                <li><a href="aboutUs.html">About Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="section welcome" id="login">
            <div>
                <h1>Welcome back</h1>
                <p>Log in to see your bookings and manage your appointments.</p>
            </div>

            <form class="form" onsubmit="return formdata(event)">
                <div class="field">
                    <label for="userName">User name</label>
                    <input type="text" id="userName" name="userName" autocomplete="username" />
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" />
                </div>
                <button type="submit" class="btn btn-solid">Log in</button>
            </form>
        </section>

        <section class="section">
            <h2>Book an appointment</h2>
            <div class="actions">
                <a class="btn btn-solid" href="bookings.html">Book a session</a>
                <a class="btn btn-ghost" href="braids.html">Browse braids</a>
            </div>
        </section>
    </main>


    <script>
        /* ---------- Login form ---------- */
        function formdata(event) {
            if (event) event.preventDefault();
            var userName = document.getElementById("userName").value;
            var password = document.getElementById("password").value;
            // Send userName and password to your login handler here.
            return false;
        }

        /* ---------- Collapsible menu ---------- */
        (function () {
            var toggle = document.getElementById("menuToggle");
            var menu = document.getElementById("menu");
            var loginToggle = document.getElementById("loginToggle");
            var loginSub = document.getElementById("loginSub");

            function setMenu(open) {
                menu.hidden = !open;
                toggle.setAttribute("aria-expanded", String(open));
            }

            toggle.addEventListener("click", function () {
                setMenu(menu.hidden);
            });

            loginToggle.addEventListener("click", function () {
                var open = loginSub.hidden;
                loginSub.hidden = !open;
                loginToggle.setAttribute("aria-expanded", String(open));
                if (open) document.getElementById("login").scrollIntoView({ block: "start" });
            });

            document.addEventListener("click", function (e) {
                if (!menu.hidden && !menu.contains(e.target) && !toggle.contains(e.target)) setMenu(false);
            });

            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && !menu.hidden) {
                    setMenu(false);
                    toggle.focus();
                }
            });
        })();
    </script>
</body>

</html>
